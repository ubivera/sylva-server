[package]
name = "hearth"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Sylva Hearth API library (state, extractors, handlers for /api/*)"

[lib]
name = "hearth"
path = "src/lib.rs"

[features]
# Opt-in cross-stack end-to-end test (drives the real sylva-sdk client against a
# live in-process server). Off by default, so the standard suite stays fully
# decoupled from the SDK's build. Run: cargo test -p hearth --features e2e
e2e = ["dep:sylva-sdk"]

[dependencies]
tokio = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
subtle = { workspace = true }
arc-swap = { workspace = true }
rand = { workspace = true }
ed25519-dalek = { workspace = true }
webauthn-rs = { workspace = true }
url = { workspace = true }

identity = { path = "../identity" }
audit = { path = "../audit" }
auth = { path = "../auth" }
authz = { path = "../authz" }
notifications = { path = "../notifications" }
pending = { path = "../pending" }
platform = { path = "../platform" }

# Optional, `e2e`-feature only: the real SDK client, to drive the cross-stack
# end-to-end test (tests/integration/sdk_e2e.rs). A sibling path dep — present in
# the standard workspace layout; the standard suite never pulls it.
sylva-sdk = { path = "../../../sylva-sdk", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

[dev-dependencies]
uuid = { workspace = true, features = ["v4"] }
web = { path = "../web" }
arc-swap = { workspace = true }
proto = { path = "../proto" }
platform = { path = "../platform" }
tonic = { workspace = true }

[[test]]
name = "integration"
path = "tests/integration.rs"

[lints]
workspace = true
