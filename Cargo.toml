[workspace]
resolver = "2"
members = ["crates/audit", "crates/auth", "crates/authz", "crates/bootstrap", "crates/clean", "crates/hearth", "crates/identity", "crates/notifications", "crates/provision"]

[workspace.package]
edition = "2024"
rust-version = "1.95"
authors = ["Ubivera, LLC"]
license = "UNLICENSED"
repository = "https://github.com/ubivera/sylva-hearth"

[workspace.dependencies]
tokio = { version = "1.52", features = ["macros", "rt-multi-thread", "signal", "net", "sync", "time", "process"] }

axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }

thiserror = "2"
anyhow = "1"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "migrate", "macros", "uuid", "chrono", "json"] }

uuid = { version = "1", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }

argon2 = "0.5"
sha2 = "0.10"
rand = "0.8"
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls", "smtp-transport", "builder", "ring", "webpki-roots"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "warn"
unimplemented = "warn"
print_stdout = "warn"
print_stderr = "warn"
