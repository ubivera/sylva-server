[workspace]
resolver = "2"
members = ["crates/hearth", "crates/bootstrap"]

[workspace.package]
edition = "2024"
rust-version = "1.95"
authors = ["Ubivera, LLC"]
license = "UNLICENSED"
repository = "https://github.com/ubivera/sylva-hearth"

[workspace.dependencies]
tokio = { version = "1.52", features = ["macros", "rt-multi-thread", "signal", "net", "sync", "time", "process"] }

axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }

thiserror = "2"
anyhow = "1"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "migrate", "macros"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "warn"
unimplemented = "warn"
print_stdout = "warn"
print_stderr = "warn"
