[workspace]
resolver = "2"
members = ["crates/audit", "crates/auth", "crates/authz", "crates/bootstrap", "crates/clean", "crates/hearth", "crates/hearth-server", "crates/identity", "crates/notifications", "crates/pending", "crates/platform", "crates/proto", "crates/provision", "crates/web"]

[workspace.package]
edition = "2024"
rust-version = "1.95"
authors = ["Ubivera, LLC"]
license = "UNLICENSED"
repository = "https://github.com/ubivera/sylva-hearth"

[workspace.dependencies]
tokio = { version = "1.52", features = ["macros", "rt-multi-thread", "signal", "net", "sync", "time", "process"] }

axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }

thiserror = "2"
anyhow = "1"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "migrate", "macros", "uuid", "chrono", "json"] }

uuid = { version = "1", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }

argon2 = "0.5"
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
subtle = "2"
arc-swap = "1"
rand = "0.8"
base32 = "0.5"
chacha20poly1305 = "0.10"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
webauthn-rs = { version = "0.5", features = [
    "danger-allow-state-serialisation",
    "conditional-ui",
] }
url = "2.5"
maud = "0.27"
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls", "smtp-transport", "builder", "ring", "webpki-roots"] }

# gRPC platform API. tonic 0.14 split codegen/runtime out of the core crate:
# the prost codec lives in `tonic-prost`, codegen in `tonic-prost-build`.
# `protox` is a pure-Rust .proto compiler so the build needs no system `protoc`.
tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"
tonic-prost-build = "0.14"
protox = "0.9"
tokio-stream = "0.1"

windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "warn"
unimplemented = "warn"
print_stdout = "warn"
print_stderr = "warn"
